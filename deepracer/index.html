<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeepRacer">
<meta name="theme-color" content="#0a0e1a">
<title>DEEP RACER</title>
<style>
/* ===== Global Reset & Theme ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0a0e1a;
  color: #e2e8f0;
  font-family: 'Courier New', monospace;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
body { display: flex; flex-direction: column; align-items: center; }

/* ===== Header ===== */
.header {
  width: 100%; max-width: 420px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px 6px;
  font-family: sans-serif; text-transform: uppercase;
  letter-spacing: 2px;
}
.header .title { font-size: 16px; font-weight: 700; color: #00d4ff; }
.header .stats { font-size: 11px; color: #94a3b8; }
.header .stats span { color: #00d4ff; margin-left: 6px; }

/* ===== Canvas containers ===== */
.canvas-wrap {
  width: 100%; max-width: 420px;
  position: relative;
  background: #111827;
  border: 1px solid #1e293b;
  margin: 4px 0;
}
.canvas-wrap canvas { display: block; width: 100%; height: auto; }

/* ===== Panel ===== */
.panel {
  width: 100%; max-width: 420px;
  background: #111827;
  border: 1px solid #1e293b;
  padding: 10px 14px;
  margin: 4px 0;
}
.panel-title {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.5px; color: #64748b;
  margin-bottom: 8px;
  font-family: sans-serif;
}

/* ===== Sliders ===== */
.slider-row {
  display: flex; align-items: center;
  margin-bottom: 6px;
}
.slider-row label {
  width: 100px; font-size: 11px; color: #94a3b8;
}
.slider-row input[type=range] {
  flex: 1;
  -webkit-appearance: none; appearance: none;
  height: 6px; background: #1e293b; border-radius: 3px;
  outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px;
  background: #00d4ff; border-radius: 50%;
  cursor: pointer;
}
.slider-row .val {
  width: 40px; text-align: right;
  font-size: 11px; color: #00d4ff;
}

/* ===== Controls ===== */
.controls {
  width: 100%; max-width: 420px;
  display: flex; gap: 8px;
  padding: 8px 14px 14px;
}
.controls button {
  flex: 1; padding: 10px 0;
  background: #1e293b; color: #e2e8f0;
  border: 1px solid #334155; border-radius: 6px;
  font-family: sans-serif; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: background 0.15s;
}
.controls button:active { background: #334155; }
.controls button.primary { background: #00d4ff; color: #0a0e1a; border-color: #00d4ff; }
.controls button.primary:active { background: #00b8d9; }
.controls button.danger { border-color: #ff4d6d; color: #ff4d6d; }
.controls button.danger:active { background: #3b1928; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="title">DEEP RACER</div>
  <div class="stats">
    GEN<span id="genNum">0</span>
    BEST<span id="bestTime">--</span>
  </div>
</div>

<!-- Course Canvas -->
<div class="canvas-wrap">
  <canvas id="courseCanvas" width="420" height="420"></canvas>
</div>

<!-- NN Visualization Canvas -->
<div class="canvas-wrap">
  <canvas id="nnCanvas" width="420" height="160"></canvas>
</div>

<!-- Reward Weight Sliders -->
<div class="panel">
  <div class="panel-title">報酬ウェイト設定</div>
  <div class="slider-row">
    <label>センター維持</label>
    <input type="range" id="wCenter" min="0" max="100" value="70">
    <div class="val" id="vCenter">70%</div>
  </div>
  <div class="slider-row">
    <label>スピード</label>
    <input type="range" id="wSpeed" min="0" max="100" value="40">
    <div class="val" id="vSpeed">40%</div>
  </div>
  <div class="slider-row">
    <label>ジグザグ防止</label>
    <input type="range" id="wSmooth" min="0" max="100" value="80">
    <div class="val" id="vSmooth">80%</div>
  </div>
</div>

<!-- Learning Graph -->
<div class="canvas-wrap">
  <canvas id="graphCanvas" width="420" height="120"></canvas>
</div>

<!-- Controls -->
<div class="controls">
  <button class="primary" id="btnTrain">▶ TRAIN</button>
  <button class="danger" id="btnStop">■ STOP</button>
  <button id="btnReset">↺ RESET</button>
</div>

<script>
// ========================================================
//  AWS DeepRacer 簡易体験 PWA
// ========================================================

// ===== Constants =====
const POP_SIZE = 10;
const MAX_STEPS = 800;
const COURSE_W = 420;
const COURSE_H = 420;
const TRACK_RADIUS_OUTER = 160;
const TRACK_RADIUS_INNER = 100;
const TRACK_WIDTH = TRACK_RADIUS_OUTER - TRACK_RADIUS_INNER;
const CX = COURSE_W / 2;
const CY = COURSE_H / 2;
const SENSOR_ANGLES = [-60, -30, 0, 30, 60]; // degrees
const SENSOR_MAX = 80;
const NUM_WEIGHTS = 5 * 6 + 6 + 6 * 2 + 2; // weights + biases = 30+6+12+2 = 50
const ELITE_FRAC = 0.3;
const MUTATION_RATE_INIT = 0.10;
const MUTATION_DECAY = 0.997;
const STEPS_PER_FRAME = 4;

// ===== Canvas Setup =====
const courseCanvas = document.getElementById('courseCanvas');
const courseCtx = courseCanvas.getContext('2d');
const nnCanvas = document.getElementById('nnCanvas');
const nnCtx = nnCanvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const graphCtx = graphCanvas.getContext('2d');

// ===== Course Waypoints (Oval) =====
// Generate an oval track center-line as a list of waypoints
const NUM_WAYPOINTS = 100;
const waypoints = [];
// Use ellipse: semi-major along X, semi-minor along Y
const SEMI_MAJOR = 145;
const SEMI_MINOR = 120;
for (let i = 0; i < NUM_WAYPOINTS; i++) {
  const a = (i / NUM_WAYPOINTS) * Math.PI * 2;
  waypoints.push({
    x: CX + SEMI_MAJOR * Math.cos(a),
    y: CY + SEMI_MINOR * Math.sin(a)
  });
}
const HALF_TRACK = 20; // half of track width

// ===== Course geometry helpers =====
function closestWaypoint(px, py) {
  let bestD = Infinity, bestI = 0;
  for (let i = 0; i < waypoints.length; i++) {
    const dx = waypoints[i].x - px;
    const dy = waypoints[i].y - py;
    const d = dx * dx + dy * dy;
    if (d < bestD) { bestD = d; bestI = i; }
  }
  return { index: bestI, dist: Math.sqrt(bestD) };
}

function isOnTrack(px, py) {
  return closestWaypoint(px, py).dist <= HALF_TRACK + 2;
}

function distFromCenter(px, py) {
  return closestWaypoint(px, py).dist;
}

// Track boundary for sensor ray-casting
function raycast(ox, oy, angle) {
  const dx = Math.cos(angle);
  const dy = Math.sin(angle);
  let t = 0;
  const step = 2;
  while (t < SENSOR_MAX) {
    t += step;
    if (!isOnTrack(ox + dx * t, oy + dy * t)) {
      return t / SENSOR_MAX; // normalised 0..1
    }
  }
  return 1.0;
}

// ===== Neural Network =====
function createGenome() {
  const g = new Float32Array(NUM_WEIGHTS);
  for (let i = 0; i < NUM_WEIGHTS; i++) g[i] = (Math.random() - 0.5) * 2;
  return g;
}

function nnForward(genome, inputs) {
  // inputs: Float32Array(5)
  // Hidden layer: 6 nodes, tanh activation
  const wIH = genome; // first 30 weights (5*6)
  const hidden = new Float32Array(6);
  let idx = 0;
  for (let h = 0; h < 6; h++) {
    let sum = 0;
    for (let i = 0; i < 5; i++) {
      sum += inputs[i] * genome[idx++];
    }
    sum += genome[30 + h]; // bias
    hidden[h] = Math.tanh(sum);
  }
  // Output layer: 2 nodes, tanh → map to useful range
  const output = new Float32Array(2);
  let oidx = 36; // 30 weights + 6 biases
  for (let o = 0; o < 2; o++) {
    let sum = 0;
    for (let h = 0; h < 6; h++) {
      sum += hidden[h] * genome[oidx++];
    }
    sum += genome[48 + o]; // bias
    output[o] = Math.tanh(sum);
  }
  return { hidden, output };
}

// ===== Agent (Car) =====
function createAgent(genome) {
  // Start on the track at waypoint 0, facing along the track
  const startWP = 0;
  const nextWP = 1;
  const heading = Math.atan2(
    waypoints[nextWP].y - waypoints[startWP].y,
    waypoints[nextWP].x - waypoints[startWP].x
  );
  return {
    x: waypoints[startWP].x,
    y: waypoints[startWP].y,
    heading: heading,
    speed: 0,
    genome: genome,
    alive: true,
    steps: 0,
    reward: 0,
    lastSteer: 0,
    wpIndex: 0,
    laps: 0,
    sensorValues: new Float32Array(5),
    hiddenValues: new Float32Array(6),
    outputValues: new Float32Array(2)
  };
}

function stepAgent(agent, weights) {
  if (!agent.alive) return;

  // 1. Raycast sensors
  for (let i = 0; i < 5; i++) {
    const a = agent.heading + SENSOR_ANGLES[i] * Math.PI / 180;
    agent.sensorValues[i] = raycast(agent.x, agent.y, a);
  }

  // 2. NN forward pass
  const { hidden, output } = nnForward(agent.genome, agent.sensorValues);
  agent.hiddenValues = hidden;
  agent.outputValues = output;

  // 3. Apply outputs
  const steer = output[0] * 0.12; // steering angle (radians per step)
  const throttle = (output[1] + 1) / 2 * 2.5 + 0.5; // speed 0.5..3.0
  agent.heading += steer;
  agent.speed = throttle;
  agent.x += Math.cos(agent.heading) * agent.speed;
  agent.y += Math.sin(agent.heading) * agent.speed;
  agent.steps++;

  // 4. Check if on track
  if (!isOnTrack(agent.x, agent.y)) {
    agent.alive = false;
    return;
  }

  // 5. Waypoint progress
  const cw = closestWaypoint(agent.x, agent.y);
  const nextExpected = (agent.wpIndex + 1) % NUM_WAYPOINTS;
  if (cw.index === nextExpected || cw.index === (nextExpected + 1) % NUM_WAYPOINTS) {
    agent.wpIndex = cw.index;
    // Check lap completion
    if (agent.wpIndex === 0 && agent.steps > 50) {
      agent.laps++;
    }
  }

  // 6. Compute reward
  const dCenter = distFromCenter(agent.x, agent.y) / HALF_TRACK; // 0..1
  const rCenter = Math.max(0, 1 - dCenter);
  const rSpeed = Math.min(agent.speed / 3.0, 1);
  const rSmooth = Math.max(0, 1 - Math.abs(steer) / 0.12);

  const wC = weights.center / 100;
  const wS = weights.speed / 100;
  const wSm = weights.smooth / 100;
  const total = wC + wS + wSm || 1;

  agent.reward += (rCenter * wC + rSpeed * wS + rSmooth * wSm) / total;
  agent.lastSteer = steer;

  // 7. Max steps
  if (agent.steps >= MAX_STEPS) {
    agent.alive = false;
  }
}

// ===== GA =====
function crossover(a, b) {
  const child = new Float32Array(NUM_WEIGHTS);
  const p1 = Math.floor(Math.random() * NUM_WEIGHTS);
  const p2 = Math.floor(Math.random() * NUM_WEIGHTS);
  const lo = Math.min(p1, p2);
  const hi = Math.max(p1, p2);
  for (let i = 0; i < NUM_WEIGHTS; i++) {
    child[i] = (i >= lo && i <= hi) ? b[i] : a[i];
  }
  return child;
}

function mutate(genome, rate) {
  const g = new Float32Array(genome);
  for (let i = 0; i < g.length; i++) {
    if (Math.random() < rate) {
      g[i] += (Math.random() - 0.5) * 0.6;
    }
  }
  return g;
}

function nextGeneration(agents, mutationRate) {
  // Sort by reward descending
  agents.sort((a, b) => b.reward - a.reward);
  const eliteCount = Math.max(2, Math.floor(POP_SIZE * ELITE_FRAC));
  const elites = agents.slice(0, eliteCount).map(a => a.genome);
  const newGenomes = [];
  // Keep elites
  for (const e of elites) newGenomes.push(new Float32Array(e));
  // Fill rest with crossover + mutation from elites
  while (newGenomes.length < POP_SIZE) {
    const pA = elites[Math.floor(Math.random() * elites.length)];
    const pB = elites[Math.floor(Math.random() * elites.length)];
    const child = crossover(pA, pB);
    newGenomes.push(mutate(child, mutationRate));
  }
  return newGenomes;
}

// ===== Drawing =====
// Colors for agents
const AGENT_COLORS = [
  '#00d4ff','#00ff88','#ff6b35','#ffdd57','#c471f5',
  '#ff4d6d','#48dbfb','#0abde3','#feca57','#1dd1a1'
];

function drawCourse(agents, bestIdx) {
  const ctx = courseCtx;
  ctx.clearRect(0, 0, COURSE_W, COURSE_H);

  // Track surface
  ctx.beginPath();
  for (let i = 0; i <= NUM_WAYPOINTS; i++) {
    const wp = waypoints[i % NUM_WAYPOINTS];
    if (i === 0) ctx.moveTo(wp.x, wp.y);
    else ctx.lineTo(wp.x, wp.y);
  }
  ctx.closePath();
  ctx.lineWidth = HALF_TRACK * 2;
  ctx.strokeStyle = '#1a2535';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Track borders (outer + inner)
  for (const offset of [HALF_TRACK, -HALF_TRACK]) {
    ctx.beginPath();
    for (let i = 0; i <= NUM_WAYPOINTS; i++) {
      const wp = waypoints[i % NUM_WAYPOINTS];
      const wpNext = waypoints[(i + 1) % NUM_WAYPOINTS];
      const dx = wpNext.x - wp.x;
      const dy = wpNext.y - wp.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const nx = -dy / len * offset;
      const ny = dx / len * offset;
      if (i === 0) ctx.moveTo(wp.x + nx, wp.y + ny);
      else ctx.lineTo(wp.x + nx, wp.y + ny);
    }
    ctx.closePath();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#00d4ff44';
    ctx.stroke();
  }

  // Center line (dashed)
  ctx.beginPath();
  ctx.setLineDash([6, 8]);
  for (let i = 0; i <= NUM_WAYPOINTS; i++) {
    const wp = waypoints[i % NUM_WAYPOINTS];
    if (i === 0) ctx.moveTo(wp.x, wp.y);
    else ctx.lineTo(wp.x, wp.y);
  }
  ctx.closePath();
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#334155';
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw agents
  for (let i = 0; i < agents.length; i++) {
    const a = agents[i];
    if (!a.alive && state.running) continue;
    const isBest = i === bestIdx;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.heading);

    // Car body (triangle)
    const size = isBest ? 8 : 6;
    ctx.beginPath();
    ctx.moveTo(size, 0);
    ctx.lineTo(-size * 0.6, -size * 0.5);
    ctx.lineTo(-size * 0.6, size * 0.5);
    ctx.closePath();
    ctx.fillStyle = isBest ? '#00d4ff' : (AGENT_COLORS[i % AGENT_COLORS.length] + '99');
    ctx.fill();

    // Glow for best
    if (isBest) {
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Draw sensor rays for best agent
    if (isBest && a.alive) {
      ctx.restore();
      ctx.save();
      for (let s = 0; s < 5; s++) {
        const ang = a.heading + SENSOR_ANGLES[s] * Math.PI / 180;
        const len = a.sensorValues[s] * SENSOR_MAX;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x + Math.cos(ang) * len, a.y + Math.sin(ang) * len);
        ctx.strokeStyle = '#00d4ff33';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    ctx.restore();
  }
}

// ===== NN Visualization =====
const INPUT_LABELS = ['左', '前左', '前', '前右', '右'];
const OUTPUT_LABELS = ['ステア', '速度'];

function drawNN(agent) {
  const ctx = nnCtx;
  const W = 420, H = 160;
  ctx.clearRect(0, 0, W, H);

  // Layer positions
  const layers = [
    { n: 5, x: 60, vals: agent ? Array.from(agent.sensorValues) : Array(5).fill(0), labels: INPUT_LABELS },
    { n: 6, x: 210, vals: agent ? Array.from(agent.hiddenValues) : Array(6).fill(0), labels: null },
    { n: 2, x: 360, vals: agent ? Array.from(agent.outputValues) : Array(2).fill(0), labels: OUTPUT_LABELS }
  ];

  const nodeR = 14;

  // Compute node y positions
  for (const l of layers) {
    l.ys = [];
    const totalH = (l.n - 1) * 24;
    const startY = H / 2 - totalH / 2;
    for (let i = 0; i < l.n; i++) {
      l.ys.push(startY + i * 24);
    }
  }

  // Draw edges
  if (agent) {
    const genome = agent.genome;

    // Input → Hidden edges
    let idx = 0;
    for (let h = 0; h < 6; h++) {
      for (let i = 0; i < 5; i++) {
        const w = genome[idx++];
        const absW = Math.abs(w);
        ctx.beginPath();
        ctx.moveTo(layers[0].x + nodeR, layers[0].ys[i]);
        ctx.lineTo(layers[1].x - nodeR, layers[1].ys[h]);
        ctx.strokeStyle = w >= 0
          ? `rgba(0,150,255,${Math.min(absW * 0.5, 0.8)})`
          : `rgba(255,77,109,${Math.min(absW * 0.5, 0.8)})`;
        ctx.lineWidth = Math.max(0.5, absW * 2);
        ctx.stroke();
      }
    }

    // Hidden → Output edges
    let oidx = 36;
    for (let o = 0; o < 2; o++) {
      for (let h = 0; h < 6; h++) {
        const w = genome[oidx++];
        const absW = Math.abs(w);
        ctx.beginPath();
        ctx.moveTo(layers[1].x + nodeR, layers[1].ys[h]);
        ctx.lineTo(layers[2].x - nodeR, layers[2].ys[o]);
        ctx.strokeStyle = w >= 0
          ? `rgba(0,150,255,${Math.min(absW * 0.5, 0.8)})`
          : `rgba(255,77,109,${Math.min(absW * 0.5, 0.8)})`;
        ctx.lineWidth = Math.max(0.5, absW * 2);
        ctx.stroke();
      }
    }
  }

  // Draw nodes
  for (const l of layers) {
    for (let i = 0; i < l.n; i++) {
      const x = l.x, y = l.ys[i];
      const v = l.vals[i];

      // Glow
      const absV = Math.min(Math.abs(v), 1);
      if (absV > 0.1) {
        ctx.beginPath();
        ctx.arc(x, y, nodeR + 4, 0, Math.PI * 2);
        const glowColor = v >= 0 ? `rgba(0,212,255,${absV * 0.3})` : `rgba(255,77,109,${absV * 0.3})`;
        ctx.fillStyle = glowColor;
        ctx.fill();
      }

      // Node circle
      ctx.beginPath();
      ctx.arc(x, y, nodeR, 0, Math.PI * 2);
      const fillColor = v >= 0
        ? `rgba(0,${Math.floor(100 + absV * 155)},${Math.floor(180 + absV * 75)},0.9)`
        : `rgba(${Math.floor(150 + absV * 105)},${Math.floor(50 - absV * 30)},${Math.floor(70 - absV * 30)},0.9)`;
      ctx.fillStyle = fillColor;
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Value text
      ctx.fillStyle = '#fff';
      ctx.font = '9px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v.toFixed(2), x, y);

      // Labels
      if (l.labels) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px sans-serif';
        if (l.x < 200) {
          ctx.textAlign = 'right';
          ctx.fillText(l.labels[i], x - nodeR - 6, y);
        } else {
          ctx.textAlign = 'left';
          ctx.fillText(l.labels[i], x + nodeR + 6, y);
        }
      }
    }
  }

  // Layer labels
  ctx.fillStyle = '#64748b';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('INPUT', layers[0].x, 14);
  ctx.fillText('HIDDEN', layers[1].x, 14);
  ctx.fillText('OUTPUT', layers[2].x, 14);
}

// ===== Learning Graph =====
function drawGraph(history) {
  const ctx = graphCtx;
  const W = 420, H = 120;
  ctx.clearRect(0, 0, W, H);

  // Background grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 0.5;
  for (let y = 20; y < H; y += 25) {
    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 10, y); ctx.stroke();
  }

  // Title
  ctx.fillStyle = '#64748b';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('報酬推移 (世代)', 44, 14);

  if (history.length < 2) return;

  const maxR = Math.max(...history, 1);
  const minR = Math.min(...history, 0);
  const range = maxR - minR || 1;
  const padL = 42, padR = 10, padT = 22, padB = 14;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  // Y-axis labels
  ctx.fillStyle = '#64748b';
  ctx.font = '8px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(maxR.toFixed(0), padL - 4, padT + 4);
  ctx.fillText(minR.toFixed(0), padL - 4, H - padB);

  // Line
  ctx.beginPath();
  for (let i = 0; i < history.length; i++) {
    const x = padL + (i / (history.length - 1)) * plotW;
    const y = padT + (1 - (history[i] - minR) / range) * plotH;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#00d4ff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Fill under line
  const lastX = padL + plotW;
  const lastY = padT + (1 - (history[history.length - 1] - minR) / range) * plotH;
  ctx.lineTo(lastX, H - padB);
  ctx.lineTo(padL, H - padB);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,212,255,0.08)';
  ctx.fill();
}

// ===== State =====
const state = {
  running: false,
  generation: 0,
  agents: [],
  mutationRate: MUTATION_RATE_INIT,
  rewardHistory: [],
  bestGenome: null,
  animId: null
};

// ===== Reward Weights =====
function getWeights() {
  return {
    center: parseInt(document.getElementById('wCenter').value),
    speed: parseInt(document.getElementById('wSpeed').value),
    smooth: parseInt(document.getElementById('wSmooth').value)
  };
}

// Slider event listeners
['wCenter', 'wSpeed', 'wSmooth'].forEach(id => {
  const slider = document.getElementById(id);
  const vId = 'v' + id.charAt(1).toUpperCase() + id.slice(2);
  slider.addEventListener('input', () => {
    document.getElementById(vId).textContent = slider.value + '%';
  });
});

// ===== Initialise Generation =====
function initGeneration(genomes) {
  state.agents = genomes.map(g => createAgent(g));
}

function startNewGeneration() {
  let genomes;
  if (state.generation === 0 || state.agents.length === 0) {
    genomes = Array.from({ length: POP_SIZE }, () => createGenome());
  } else {
    genomes = nextGeneration(state.agents, state.mutationRate);
    state.mutationRate *= MUTATION_DECAY;
  }
  state.generation++;
  initGeneration(genomes);
  document.getElementById('genNum').textContent = state.generation;
}

// ===== Main Loop =====
function mainLoop() {
  if (!state.running) return;

  const weights = getWeights();
  let allDead = true;

  // Multiple physics steps per frame for speed
  for (let s = 0; s < STEPS_PER_FRAME; s++) {
    for (const agent of state.agents) {
      if (agent.alive) {
        stepAgent(agent, weights);
        allDead = false;
      }
    }
    // Re-check
    allDead = state.agents.every(a => !a.alive);
    if (allDead) break;
  }

  // Find best agent (alive or highest reward)
  let bestIdx = 0;
  let bestReward = -Infinity;
  for (let i = 0; i < state.agents.length; i++) {
    if (state.agents[i].reward > bestReward) {
      bestReward = state.agents[i].reward;
      bestIdx = i;
    }
  }
  state.bestGenome = state.agents[bestIdx].genome;

  // Draw
  drawCourse(state.agents, bestIdx);
  drawNN(state.agents[bestIdx]);

  // Update best time display
  const best = state.agents[bestIdx];
  document.getElementById('bestTime').textContent =
    best.laps > 0 ? best.laps + 'LAP' : best.steps + 'st';

  // Generation complete?
  if (allDead) {
    // Record best reward
    state.rewardHistory.push(Math.round(bestReward));
    drawGraph(state.rewardHistory);
    startNewGeneration();
  }

  state.animId = requestAnimationFrame(mainLoop);
}

// ===== Controls =====
document.getElementById('btnTrain').addEventListener('click', () => {
  if (state.running) return;
  state.running = true;
  if (state.agents.length === 0 || state.agents.every(a => !a.alive)) {
    startNewGeneration();
  }
  mainLoop();
});

document.getElementById('btnStop').addEventListener('click', () => {
  state.running = false;
  if (state.animId) cancelAnimationFrame(state.animId);
});

document.getElementById('btnReset').addEventListener('click', () => {
  state.running = false;
  if (state.animId) cancelAnimationFrame(state.animId);
  state.generation = 0;
  state.agents = [];
  state.mutationRate = MUTATION_RATE_INIT;
  state.rewardHistory = [];
  state.bestGenome = null;
  document.getElementById('genNum').textContent = '0';
  document.getElementById('bestTime').textContent = '--';
  // Clear canvases
  courseCtx.clearRect(0, 0, COURSE_W, COURSE_H);
  nnCtx.clearRect(0, 0, 420, 160);
  graphCtx.clearRect(0, 0, 420, 120);
  // Draw empty course
  drawCourse([], -1);
  drawNN(null);
  drawGraph([]);
});

// Initial draw
drawCourse([], -1);
drawNN(null);
drawGraph([]);
</script>
