<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#181425">
  <title>BIT BIRDS — 15秒広告</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; height: 100%; background: #181425; overflow: hidden; color: #c0cbdc;
      font: 14px -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
    #c { position: fixed; top: 0; image-rendering: pixelated; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; padding-bottom: env(safe-area-inset-bottom);
      display: flex; gap: 8px; align-items: center; justify-content: center; background: #262b44; border-top: 2px solid #181425; }
    #bar button { font: bold 15px -apple-system, system-ui, sans-serif; padding: 10px 14px; border: 2px solid #181425;
      border-radius: 4px; background: #3a4466; color: #fff; }
    #bar button.rec { background: #ff0044; }
    #bar button:disabled { opacity: .5; }
    #st { min-width: 90px; font-size: 12px; text-align: center; }
    #dl { color: #2ce8f5; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bar">
    <button id="play">▶ 再生</button>
    <button id="rec" class="rec">● 録画して保存</button>
    <span id="st">1080×1920 / 15秒</span>
  </div>
  <script src="lib/three.min.js"></script>
  <script type="module" src="js/ad/admain.js"></script>
</body>
</html>
