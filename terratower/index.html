<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TerraTower AR">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d1117">
  <title>Terra Tower AR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- Camera feed (background, mirrored) -->
  <video id="camera-video" autoplay muted playsinline></video>

  <!-- Three.js render canvas -->
  <canvas id="three-canvas"></canvas>

  <!-- Pinch position indicator -->
  <div id="pinch-dot"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="top-bar">
      <div class="hud-pill" id="score-pill">🏆 <span id="score-val">0</span></div>
      <div class="hud-pill" id="ar-badge" style="display:none">📡 AR</div>
      <div class="hud-pill" id="hand-pill">✋ 検出中...</div>
      <div class="hud-pill" id="fps-pill"><span id="fps-val">--</span> fps</div>
    </div>
    <div id="bottom-bar">
      <button id="btn-reset-view" style="display:none">🔄 視点リセット</button>
      <button id="btn-spawn">＋ ブロック追加</button>
    </div>
  </div>

  <!-- Start screen -->
  <div id="start-screen">
    <h1>Terra<br>Tower<br><span class="ar-label">AR</span></h1>
    <div class="icon-instructions">
      <div class="step"><span class="emoji">📷</span><span>カメラで手を映す</span></div>
      <div class="step"><span class="emoji">🤏</span><span>ピンチで掴む</span></div>
      <div class="step"><span class="emoji">📱</span><span>デバイスを動かして視点変更</span></div>
      <div class="step"><span class="emoji">🏗️</span><span>高く積み上げよう！</span></div>
    </div>
    <p>親指と人差し指でブロックを掴み、離すと物理落下。デバイスを傾けて自由に視点を変えられます。</p>
    <p class="permission-note">※ カメラとDeviceOrientationの許可が必要です（iOSでは確認ダイアログが表示されます）</p>
    <button id="btn-start">AR START</button>
  </div>

  <!-- Depth calibration screen -->
  <div id="calib-screen">
    <div id="calib-step-badge">STEP <span id="calib-step">1</span> / 2</div>
    <h2 id="calib-title">① 手前の設定</h2>
    <p id="calib-desc">手をカメラに近づけて、ピンチ（🤏）してください</p>
    <div id="calib-indicator"></div>
    <p id="calib-hand-status">手が検出されていません</p>
    <button id="btn-calib-skip">スキップ</button>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-msg">初期化中...</p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
