<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>ASCII Cam</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #e8e8e8;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  #canvas-wrap {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  #output {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* hidden processing canvas */
  #offscreen { display: none; }

  #controls {
    flex: 0 0 auto;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    border-top: 1px solid rgba(0, 255, 0, 0.18);
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
  }

  label {
    font-size: 11px;
    color: #8a8;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #chars-input {
    flex: 1 1 0;
    min-width: 0;
    background: rgba(0, 255, 0, 0.07);
    color: #0f0;
    border: 1px solid rgba(0, 255, 0, 0.25);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 13px;
    font-family: monospace;
    outline: none;
  }

  #chars-input:focus { border-color: rgba(0, 255, 0, 0.7); }

  #size-slider, #colors-slider {
    flex: 1 1 0;
    min-width: 60px;
    accent-color: #0f0;
  }

  #size-val {
    font-size: 12px;
    color: #0f0;
    flex-shrink: 0;
    width: 22px;
    text-align: right;
    font-family: monospace;
  }

  #colors-val {
    font-size: 12px;
    color: #0f0;
    flex-shrink: 0;
    width: 28px;
    text-align: right;
    font-family: monospace;
  }

  .icon-btn {
    background: rgba(0, 255, 0, 0.1);
    color: #e8e8e8;
    border: 1px solid rgba(0, 255, 0, 0.25);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
    transition: background 0.1s;
  }
  .icon-btn:active { background: rgba(0, 255, 0, 0.28); }

  #file-input { display: none; }

  #msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #888;
    pointer-events: none;
    text-align: center;
    padding: 20px;
    white-space: pre-line;
  }

  /* flash overlay for capture feedback */
  #flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
  }
  #flash.active { opacity: 0.55; }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="output"></canvas>
    <canvas id="offscreen"></canvas>
    <div id="flash"></div>
    <div id="msg">カメラを起動中…</div>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <label>文字</label>
      <input id="chars-input" type="text" value="@#S%?*+;:,. " maxlength="64" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="ctrl-group">
      <label>サイズ</label>
      <input id="size-slider" type="range" min="4" max="24" value="10" step="1">
      <span id="size-val">10</span>
    </div>
    <div class="ctrl-group">
      <label>色数</label>
      <input id="colors-slider" type="range" min="2" max="16" value="16" step="1">
      <span id="colors-val">16</span>
    </div>
    <input id="file-input" type="file" accept="image/*,video/*">
    <button id="btn-capture" class="icon-btn" title="撮影・保存">📷</button>
    <button id="btn-file" class="icon-btn" title="画像・動画を開く">📁</button>
    <button id="btn-flip" class="icon-btn" title="カメラ切替">🔄</button>
  </div>
</div>

<video id="vid" playsinline muted autoplay loop style="display:none"></video>

<script>
(function () {
  'use strict';

  // --- PWA Service Worker registration ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
  }

  // --- Elements ---
  const vid          = document.getElementById('vid');
  const output       = document.getElementById('output');
  const offscreen    = document.getElementById('offscreen');
  const msg          = document.getElementById('msg');
  const flash        = document.getElementById('flash');
  const charsInput   = document.getElementById('chars-input');
  const sizeSlider   = document.getElementById('size-slider');
  const sizeVal      = document.getElementById('size-val');
  const colorsSlider = document.getElementById('colors-slider');
  const colorsVal    = document.getElementById('colors-val');
  const btnFlip      = document.getElementById('btn-flip');
  const btnFile      = document.getElementById('btn-file');
  const btnCapture   = document.getElementById('btn-capture');
  const fileInput    = document.getElementById('file-input');

  const ctx  = output.getContext('2d');
  const octx = offscreen.getContext('2d', { willReadFrequently: true });

  // --- State ---
  let chars       = '@#S%?*+;:,. ';
  let fontSize    = 10;
  let colorLevels = 16;
  let facingMode  = 'environment'; // back camera
  let stream      = null;
  let rafId       = null;
  let drawRunning = false;
  let sourceMode  = 'camera'; // 'camera' | 'file-image' | 'file-video'
  let staticImage = null;
  let fileUrl     = null;

  // --- Color quantization ---
  // At colorLevels=2: true black-and-white (grayscale snapped to 0 or 255)
  // At colorLevels=3..16: each RGB channel quantized to N levels
  function quantizeColor(r, g, b) {
    if (colorLevels === 2) {
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;
      const q = gray >= 128 ? 255 : 0;
      return [q, q, q];
    }
    const step = 255 / (colorLevels - 1);
    const qr = Math.round(Math.round(r / step) * step);
    const qg = Math.round(Math.round(g / step) * step);
    const qb = Math.round(Math.round(b / step) * step);
    return [qr, qg, qb];
  }

  // --- Init controls ---
  charsInput.value = chars;
  charsInput.addEventListener('input', () => {
    const v = charsInput.value;
    chars = v.length > 0 ? v : ' ';
  });

  sizeSlider.value = fontSize;
  sizeSlider.addEventListener('input', () => {
    fontSize = parseInt(sizeSlider.value, 10);
    sizeVal.textContent = fontSize;
  });

  colorsSlider.value = colorLevels;
  colorsVal.textContent = colorLevels === 2 ? 'B&W' : colorLevels;
  colorsSlider.addEventListener('input', () => {
    colorLevels = parseInt(colorsSlider.value, 10);
    colorsVal.textContent = colorLevels === 2 ? 'B&W' : colorLevels;
  });

  // --- File import ---
  btnFile.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) loadFile(file);
    fileInput.value = ''; // reset so the same file can be selected again
  });

  // --- Capture / save current ASCII frame ---
  btnCapture.addEventListener('click', captureFrame);

  function captureFrame() {
    if (output.width === 0 || output.height === 0) return;
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 120);
    output.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const now = new Date();
      const pad = num => String(num).padStart(2, '0');
      a.download = `ascii-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000); // revoke after 10 s to allow download to start
    }, 'image/png');
  }

  // --- Camera flip / return to camera ---
  btnFlip.addEventListener('click', () => {
    if (sourceMode !== 'camera') {
      // Return from file mode to live camera
      cleanupFile();
      startCamera();
    } else {
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    }
  });

  // --- Canvas resize ---
  function resizeCanvas() {
    const wrap = output.parentElement;
    output.width  = wrap.clientWidth;
    output.height = wrap.clientHeight;
  }

  const resizeObserver = new ResizeObserver(resizeCanvas);
  resizeObserver.observe(output.parentElement);
  resizeCanvas();

  // --- Draw loop control ---
  function startDrawLoop() {
    if (drawRunning) return;
    drawRunning = true;
    rafId = requestAnimationFrame(draw);
  }

  function stopDrawLoop() {
    drawRunning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  // --- File cleanup ---
  function cleanupFile() {
    stopDrawLoop();
    staticImage = null;
    if (fileUrl) { URL.revokeObjectURL(fileUrl); fileUrl = null; }
    vid.pause();
    vid.srcObject = null;
    vid.src = '';
  }

  // --- Camera ---
  async function startCamera() {
    stopDrawLoop();
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    vid.pause();
    vid.srcObject = null;
    vid.src = '';
    sourceMode = 'camera';
    msg.textContent = 'カメラを起動中…';
    msg.style.display = 'flex';

    const constraints = {
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      vid.srcObject = stream;
      await vid.play();
      msg.style.display = 'none';
      startDrawLoop();
    } catch (err) {
      msg.textContent = 'カメラへのアクセスが拒否されました。\nブラウザの設定でカメラを許可してください。\n(' + err.message + ')';
      msg.style.display = 'flex';
    }
  }

  // --- File loading (image or video from device) ---
  function loadFile(file) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    cleanupFile();

    fileUrl = URL.createObjectURL(file);
    msg.textContent = '読み込み中…';
    msg.style.display = 'flex';

    if (file.type.startsWith('image/')) {
      const img = new Image();
      img.onload = () => {
        staticImage = img;
        sourceMode = 'file-image';
        msg.style.display = 'none';
        startDrawLoop();
      };
      img.onerror = () => {
        msg.textContent = '画像を読み込めませんでした。';
      };
      img.src = fileUrl;

    } else if (file.type.startsWith('video/')) {
      sourceMode = 'file-video';
      vid.src = fileUrl;
      vid.loop = true;
      vid.muted = true;
      vid.oncanplay = () => {
        vid.oncanplay = null;
        msg.style.display = 'none';
        vid.play().catch(err => {
          msg.textContent = '動画を再生できませんでした。\n(' + err.message + ')';
          msg.style.display = 'flex';
        });
        startDrawLoop();
      };
      vid.onerror = () => {
        msg.textContent = '動画を読み込めませんでした。';
      };

    } else {
      msg.textContent = 'このファイル形式には対応していません。';
    }
  }

  // --- ASCII render ---
  function draw() {
    if (!drawRunning) return;
    rafId = requestAnimationFrame(draw);

    const W = output.width;
    const H = output.height;
    if (W === 0 || H === 0) return;

    // Determine render source
    let source;
    if (sourceMode === 'file-image') {
      source = staticImage;
      if (!source || !source.complete || source.naturalWidth === 0) return;
    } else {
      source = vid;
      if (vid.readyState < vid.HAVE_ENOUGH_DATA) return;
    }

    const fsize  = Math.max(4, fontSize);
    const charW  = fsize * 0.6;  // monospace width ≈ 0.6× height
    const charH  = fsize;
    const cols   = Math.floor(W / charW);
    const rows   = Math.floor(H / charH);
    if (cols < 1 || rows < 1) return;

    // Downscale source into offscreen canvas, preserving aspect ratio (cover crop)
    offscreen.width  = cols;
    offscreen.height = rows;

    const srcW = source.videoWidth  || source.naturalWidth  || source.width  || cols;
    const srcH = source.videoHeight || source.naturalHeight || source.height || rows;
    if (srcW > 0 && srcH > 0) {
      // Effective pixel aspect ratio of the output canvas
      const outAR = (cols * charW) / (rows * charH);
      const srcAR = srcW / srcH;
      let sx = 0, sy = 0, sw = srcW, sh = srcH;
      if (srcAR > outAR) {
        // Source is wider → crop horizontally (keep vertical, center crop)
        sw = srcH * outAR;
        sx = (srcW - sw) / 2;
      } else if (srcAR < outAR) {
        // Source is taller → crop vertically
        sh = srcW / outAR;
        sy = (srcH - sh) / 2;
      }
      octx.drawImage(source, sx, sy, sw, sh, 0, 0, cols, rows);
    } else {
      octx.drawImage(source, 0, 0, cols, rows);
    }
    const imgData = octx.getImageData(0, 0, cols, rows).data;

    // Render ASCII to main canvas
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.font = `${fsize}px monospace`;
    ctx.textBaseline = 'top';

    const clen = chars.length;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const i  = (row * cols + col) * 4;
        const r  = imgData[i];
        const g  = imgData[i + 1];
        const b  = imgData[i + 2];

        // brightness 0-1 using ITU-R BT.601 luminance coefficients
        const bright = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const charIdx = Math.min(Math.floor(bright * clen), clen - 1);
        const ch = chars[charIdx];

        if (ch === ' ') continue; // skip spaces for performance

        const [qr, qg, qb] = quantizeColor(r, g, b);
        if (qr === 0 && qg === 0 && qb === 0) continue; // invisible on black bg

        ctx.fillStyle = `rgb(${qr},${qg},${qb})`;
        ctx.fillText(ch, col * charW, row * charH);
      }
    }
  }

  // --- Start ---
  startCamera();
})();
</script>
</body>
</html>
