<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Cebu Casino</title>
  <link rel="stylesheet" href="style/global.css">
  <style>
    body {
      overflow-y: auto;
      background: var(--bg-deep);
    }

    .lobby-header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    .lobby-header h1 {
      font-size: 36px;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(201,168,76,0.3);
      margin-bottom: 4px;
    }

    .lobby-header .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .lobby-balance {
      text-align: center;
      padding: 16px;
      font-size: 22px;
      color: var(--gold-light);
    }

    .lobby-balance .amount {
      font-weight: 600;
    }

    .reset-btn {
      display: inline-block;
      margin-left: 10px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
      padding: 2px 8px;
      border-radius: 10px;
      cursor: pointer;
      background: none;
      font-family: 'Crimson Pro', serif;
    }

    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 10px 16px 30px;
      max-width: 420px;
      margin: 0 auto;
    }

    .game-card {
      position: relative;
      background: linear-gradient(145deg, #151520, #0e0e18);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-card:active {
      transform: scale(0.96);
    }

    .game-card .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .game-card .name {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .game-card .desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .game-card.wide {
      grid-column: 1 / -1;
      aspect-ratio: 2.2;
    }

    .game-card canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.2;
    }

    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      box-shadow: inset 0 0 30px rgba(201,168,76,0.05);
      pointer-events: none;
    }

    .splash {
      position: fixed;
      inset: 0;
      background: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s;
    }

    .splash h1 {
      font-size: 42px;
      color: var(--gold);
      letter-spacing: 6px;
      opacity: 0;
      animation: splashIn 1.2s ease-out forwards;
    }

    .splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes splashIn {
      0% { opacity: 0; transform: scale(0.8); }
      60% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Splash Screen -->
  <div class="splash" id="splash">
    <h1>CEBU CASINO</h1>
  </div>

  <!-- Lobby -->
  <div id="lobby" style="display:none;">
    <div class="lobby-header">
      <h1>CEBU CASINO</h1>
      <div class="subtitle">Premium Gaming</div>
    </div>

    <div class="lobby-balance">
      💰 <span class="amount" id="balanceDisplay">10,000</span>
      <button class="reset-btn" id="resetBtn">RESET</button>
    </div>

    <div class="game-grid">
      <div class="game-card" data-game="slots">
        <span class="icon">🎰</span>
        <span class="name">Slots</span>
        <span class="desc">3-Reel Classic</span>
      </div>
      <div class="game-card" data-game="blackjack">
        <span class="icon">🃏</span>
        <span class="name">Blackjack</span>
        <span class="desc">Beat the Dealer</span>
      </div>
      <div class="game-card" data-game="roulette">
        <span class="icon">🎡</span>
        <span class="name">Roulette</span>
        <span class="desc">European Wheel</span>
      </div>
      <div class="game-card" data-game="baccarat">
        <span class="icon">🎴</span>
        <span class="name">Baccarat</span>
        <span class="desc">Punto Banco</span>
      </div>
      <div class="game-card wide" data-game="dragon-tiger">
        <span class="icon">🐉</span>
        <span class="name">Dragon Tiger</span>
        <span class="desc">One Card Showdown</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
