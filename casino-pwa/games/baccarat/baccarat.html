<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <title>Baccarat — Cebu Casino</title>
  <link rel="stylesheet" href="../../style/global.css">
  <link rel="stylesheet" href="baccarat.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="balance-bar">
    <button class="back-btn" id="backBtn">← Lobby</button>
    <span class="balance" id="balanceDisplay">💰 10,000</span>
  </div>

  <div class="canvas-container" id="canvasContainer"></div>

  <div class="game-overlay">
    <div class="hand-scores" id="handScores" style="display:none;">
      <div class="hand-score player-side">PLAYER: <span id="playerScore">0</span></div>
      <div class="hand-score banker-side">BANKER: <span id="bankerScore">0</span></div>
    </div>

    <div class="bet-area" id="betArea">
      <button class="bet-option player-bet" data-bet="player">PLAYER<br><small>1:1</small></button>
      <button class="bet-option tie-bet" data-bet="tie">TIE<br><small>8:1</small></button>
      <button class="bet-option banker-bet" data-bet="banker">BANKER<br><small>1:0.95</small></button>
    </div>

    <div class="bet-controls">
      <button class="chip-btn" data-amount="10">10</button>
      <button class="chip-btn selected" data-amount="50">50</button>
      <button class="chip-btn" data-amount="100">100</button>
      <button class="chip-btn" data-amount="500">500</button>
    </div>

    <div style="text-align:center; padding: 0 0 10px;">
      <button class="action-btn primary" id="dealBtn">DEAL</button>
    </div>

    <div class="road-container" id="roadContainer">
      <div class="road-grid" id="roadGrid"></div>
    </div>
  </div>

  <div class="result-popup" id="resultPopup">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
  </div>

  <script type="module" src="baccarat.js"></script>
</body>
</html>
