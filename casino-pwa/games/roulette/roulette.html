<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <title>Roulette — Cebu Casino</title>
  <link rel="stylesheet" href="../../style/global.css">
  <link rel="stylesheet" href="roulette.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="balance-bar">
    <button class="back-btn" id="backBtn">← Lobby</button>
    <span class="balance" id="balanceDisplay">💰 10,000</span>
  </div>

  <div class="canvas-container" id="canvasContainer"></div>

  <div class="game-overlay">
    <div class="result-number" id="resultNumber" style="display:none;">
      <span id="resultNum"></span>
    </div>

    <div class="betting-board" id="bettingBoard">
      <div class="outside-bets">
        <button class="bet-cell outside red-bet" data-bet="red">RED</button>
        <button class="bet-cell outside black-bet" data-bet="black">BLACK</button>
        <button class="bet-cell outside" data-bet="odd">ODD</button>
        <button class="bet-cell outside" data-bet="even">EVEN</button>
        <button class="bet-cell outside" data-bet="low">1-18</button>
        <button class="bet-cell outside" data-bet="high">19-36</button>
      </div>
      <div class="dozen-bets">
        <button class="bet-cell dozen" data-bet="dozen1">1st 12</button>
        <button class="bet-cell dozen" data-bet="dozen2">2nd 12</button>
        <button class="bet-cell dozen" data-bet="dozen3">3rd 12</button>
      </div>
      <div class="number-grid" id="numberGrid"></div>
    </div>

    <div class="bet-controls">
      <button class="chip-btn" data-amount="10">10</button>
      <button class="chip-btn selected" data-amount="50">50</button>
      <button class="chip-btn" data-amount="100">100</button>
      <button class="chip-btn" data-amount="500">500</button>
    </div>

    <div style="text-align:center; padding: 0 0 20px;">
      <button class="action-btn primary" id="spinBtn">SPIN</button>
    </div>
  </div>

  <div class="result-popup" id="resultPopup">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
  </div>

  <script type="module" src="roulette.js"></script>
</body>
</html>
