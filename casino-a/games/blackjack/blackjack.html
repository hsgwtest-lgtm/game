<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../../style/global.css">
  <link rel="stylesheet" href="./blackjack.css">
  <title>Blackjack</title>
</head>
<body>
  <div class="blackjack-page">
    <header class="top-bar">
      <a class="back-btn" href="../../index.html" aria-label="Back to lobby">←</a>
      <div class="title">BLACKJACK</div>
      <div class="balance" id="balance">¥10,000</div>
    </header>

    <main class="blackjack-layout">
      <section class="table-shell" aria-label="Blackjack table">
        <canvas id="tableCanvas" class="game-canvas" aria-label="Blackjack table canvas"></canvas>
      </section>

      <section class="hud-grid" aria-label="Scores and status">
        <div class="score-card">
          <span class="label">Dealer</span>
          <strong id="dealerScore">—</strong>
        </div>
        <div class="status-card">
          <span class="label">Table</span>
          <strong id="statusText">Place your bet to begin.</strong>
        </div>
        <div class="score-card">
          <span class="label">Player</span>
          <strong id="playerScore">—</strong>
        </div>
      </section>

      <section class="controls-panel" aria-label="Blackjack controls">
        <div class="action-grid">
          <button id="hitBtn" class="action-btn">HIT</button>
          <button id="standBtn" class="action-btn">STAND</button>
          <button id="doubleBtn" class="action-btn">DOUBLE DOWN</button>
          <button id="splitBtn" class="action-btn">SPLIT</button>
          <button id="surrenderBtn" class="action-btn danger">SURRENDER</button>
        </div>

        <div id="insurancePanel" class="insurance-panel hidden" aria-live="polite">
          <div class="insurance-copy">Dealer shows an Ace. Take insurance for half your bet?</div>
          <div class="insurance-actions">
            <button id="insuranceBtn" class="action-btn gold-accent">INSURANCE</button>
            <button id="skipInsuranceBtn" class="action-btn">SKIP</button>
          </div>
        </div>

        <div class="bet-panel">
          <div class="bet-header">
            <span class="label">Bet</span>
            <strong id="betDisplay">¥100</strong>
          </div>
          <div class="bet-selector" role="group" aria-label="Bet amount selector">
            <button class="chip-btn active" data-bet="100">100</button>
            <button class="chip-btn" data-bet="500">500</button>
            <button class="chip-btn" data-bet="1000">1000</button>
            <button class="chip-btn" data-bet="5000">5000</button>
          </div>
          <button id="dealBtn" class="btn-gold deal-btn">DEAL</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./blackjack.js"></script>
</body>
</html>
